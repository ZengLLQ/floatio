name: Release Floatio

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS Installer (DMG)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: |
          npm --prefix apps/web install
          npm --prefix apps/desktop install

      - name: Build Web Application
        run: npm --prefix apps/web run build

      - name: Build Desktop Application (macOS DMG & App)
        run: |
          cd apps/desktop
          npx --yes @tauri-apps/cli build --bundles dmg,app

      - name: Package .app archive
        run: |
          if [ -d "target/release/bundle/macos/Floatio.app" ]; then
            cd target/release/bundle/macos
            tar -czvf Floatio_1.0.0_aarch64.app.tar.gz Floatio.app
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floatio-macos-installer
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Floatio v1.0.0"
          draft: false
          prerelease: false
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.tar.gz
