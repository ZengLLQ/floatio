<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radial subtle glow -->
    <radialGradient id="dieGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3C3D37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#181C14" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Circular Outer Base -->
  <circle cx="256" cy="256" r="256" fill="#181C14" />
  
  <!-- 2. Concentric Outer Trim Rings -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#3C3D37" stroke-width="6" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#697565" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.8" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#3C3D37" stroke-width="3" />

  <!-- 3. Radial Circuit Pins & Traces -->
  <g stroke="#697565" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <!-- Top -->
    <line x1="226" y1="26" x2="226" y2="108" />
    <line x1="256" y1="20" x2="256" y2="108" stroke="#ECDFCC" stroke-width="7" />
    <line x1="286" y1="26" x2="286" y2="108" />
    
    <!-- Bottom -->
    <line x1="226" y1="404" x2="226" y2="486" />
    <line x1="256" y1="404" x2="256" y2="492" stroke="#ECDFCC" stroke-width="7" />
    <line x1="286" y1="404" x2="286" y2="486" />
    
    <!-- Left -->
    <line x1="26" y1="226" x2="108" y2="226" />
    <line x1="20" y1="256" x2="108" y2="256" stroke="#ECDFCC" stroke-width="7" />
    <line x1="26" y1="286" x2="108" y2="286" />
    
    <!-- Right -->
    <line x1="404" y1="226" x2="486" y2="226" />
    <line x1="404" y1="256" x2="492" y2="256" stroke="#ECDFCC" stroke-width="7" />
    <line x1="404" y1="286" x2="486" y2="286" />

    <!-- Corner Diagonal Nodes -->
    <line x1="88" y1="88" x2="136" y2="136" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="424" y1="88" x2="376" y2="136" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="88" y1="424" x2="136" y2="376" stroke-width="4" stroke-dasharray="8 6" />
    <line x1="424" y1="424" x2="376" y2="376" stroke-width="4" stroke-dasharray="8 6" />
  </g>

  <!-- 4. Corner Golden Accent Terminal Dots -->
  <g fill="#ECDFCC">
    <circle cx="82" cy="82" r="7" />
    <circle cx="430" cy="82" r="7" />
    <circle cx="82" cy="430" r="7" />
    <circle cx="430" cy="430" r="7" />
  </g>

  <!-- 5. Central Microchip Body with Drop Shadow -->
  <rect x="110" y="110" width="292" height="292" rx="52" fill="#3C3D37" stroke="#697565" stroke-width="8" filter="url(#shadow)" />
  
  <!-- 6. Inner Processor Die -->
  <rect x="146" y="146" width="220" height="220" rx="36" fill="url(#dieGlow)" stroke="#181C14" stroke-width="4" />
  
  <!-- 7. Silicon Border Accent -->
  <rect x="156" y="156" width="200" height="200" rx="28" fill="none" stroke="#697565" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- 8. Typography: 754 & IEEE -->
  <!-- IEEE 754 Big Number -->
  <text x="256" y="246" text-anchor="middle" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ECDFCC" letter-spacing="3">754</text>
  
  <!-- IEEE Label -->
  <text x="256" y="296" text-anchor="middle" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#697565" letter-spacing="6">IEEE</text>
  
  <!-- 9. Circuit Status LED Binary Dots -->
  <g>
    <circle cx="196" cy="336" r="7" fill="#697565" />
    <circle cx="226" cy="336" r="7" fill="#ECDFCC" />
    <circle cx="256" cy="336" r="8" fill="#ECDFCC" />
    <circle cx="286" cy="336" r="7" fill="#ECDFCC" />
    <circle cx="316" cy="336" r="7" fill="#697565" />
  </g>
</svg>
