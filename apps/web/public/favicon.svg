<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#181C14" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#3C3D37" stroke-width="12" />
  
  <!-- Outer Pins (Top & Bottom) -->
  <g fill="#697565">
    <rect x="136" y="56" width="32" height="48" rx="8" />
    <rect x="200" y="56" width="32" height="48" rx="8" />
    <rect x="280" y="56" width="32" height="48" rx="8" />
    <rect x="344" y="56" width="32" height="48" rx="8" />
    
    <rect x="136" y="408" width="32" height="48" rx="8" />
    <rect x="200" y="408" width="32" height="48" rx="8" />
    <rect x="280" y="408" width="32" height="48" rx="8" />
    <rect x="344" y="408" width="32" height="48" rx="8" />

    <!-- Outer Pins (Left & Right) -->
    <rect x="56" y="136" width="48" height="32" rx="8" />
    <rect x="56" y="200" width="48" height="32" rx="8" />
    <rect x="56" y="280" width="48" height="32" rx="8" />
    <rect x="56" y="344" width="48" height="32" rx="8" />
    
    <rect x="408" y="136" width="48" height="32" rx="8" />
    <rect x="408" y="200" width="48" height="32" rx="8" />
    <rect x="408" y="280" width="48" height="32" rx="8" />
    <rect x="408" y="344" width="48" height="32" rx="8" />
  </g>

  <!-- Central Chip Body -->
  <rect x="104" y="104" width="304" height="304" rx="44" fill="#3C3D37" stroke="#697565" stroke-width="8" />
  
  <!-- Inner Die Area -->
  <rect x="144" y="144" width="224" height="224" rx="28" fill="#181C14" />
  
  <!-- IEEE 754 Text & Binary Badge -->
  <text x="256" y="235" text-anchor="middle" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#ECDFCC" letter-spacing="3">754</text>
  <text x="256" y="285" text-anchor="middle" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#697565" letter-spacing="5">IEEE</text>
  
  <!-- Subtle Binary Dots -->
  <circle cx="184" cy="330" r="7" fill="#697565" />
  <circle cx="216" cy="330" r="7" fill="#ECDFCC" />
  <circle cx="248" cy="330" r="7" fill="#ECDFCC" />
  <circle cx="280" cy="330" r="7" fill="#697565" />
  <circle cx="312" cy="330" r="7" fill="#ECDFCC" />
</svg>
