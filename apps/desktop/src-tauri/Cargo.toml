[package]
name = "ieee754-desktop"
version = "1.0.0"
description = "IEEE 754 Explorer Desktop Application"
authors = ["JAYCEE 曾令强"]
edition = "2021"

[lib]
name = "ieee754_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ieee754-core = { path = "../../../crates/ieee754-core" }
