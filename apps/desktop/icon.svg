<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="128" fill="#181C14"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#3C3D37" stroke-width="12"/>
  <g transform="translate(64, 120)">
    <!-- Sign bit block -->
    <rect x="0" y="0" width="60" height="90" rx="16" fill="#697565"/>
    <text x="30" y="58" font-family="sans-serif" font-size="40" font-weight="bold" fill="#181C14" text-anchor="middle">S</text>
    
    <!-- Exponent blocks -->
    <rect x="76" y="0" width="130" height="90" rx="16" fill="#697565"/>
    <text x="141" y="58" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ECDFCC" text-anchor="middle">EXP</text>
    
    <!-- Fraction blocks -->
    <rect x="222" y="0" width="162" height="90" rx="16" fill="#3C3D37"/>
    <text x="303" y="58" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ECDFCC" text-anchor="middle">FRAC</text>
  </g>
  
  <!-- IEEE 754 Text -->
  <text x="256" y="320" font-family="sans-serif" font-size="64" font-weight="bold" fill="#ECDFCC" text-anchor="middle" letter-spacing="4">IEEE 754</text>
  <text x="256" y="380" font-family="sans-serif" font-size="28" font-weight="medium" fill="#697565" text-anchor="middle" letter-spacing="8">EXPLORER</text>
</svg>
