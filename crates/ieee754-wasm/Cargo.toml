[package]
name = "ieee754-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for Floatio"
authors = ["JAYCEE 曾令强"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
ieee754-core = { path = "../ieee754-core" }
